plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.poselandmarker'
version = '0.1.0'

android {
  namespace "expo.modules.poselandmarker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // MediaPipe Tasks Vision — official Google SDK for pose landmark detection
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'

  // CameraX — needed to get a live camera frame stream to feed into MediaPipe
  implementation 'androidx.camera:camera-core:1.3.4'
  implementation 'androidx.camera:camera-camera2:1.3.4'
  implementation 'androidx.camera:camera-lifecycle:1.3.4'
  implementation 'androidx.camera:camera-view:1.3.4'
}